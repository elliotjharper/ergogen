meta:
  engine: 4.1.0
units:
  # kx/ky is the layout space used to position edge-to-edge,
  # for example using cherry mx as a guide:
  # a cherry mx switch pcb plate hole is 14x14,
  # a keycap is 18x18,
  # but the size to use for laying out edge to edge (taking into account gaps between switches/keycaps) is 19.05mm
  kx: 19.05
  ky: 19.05

  # make the ergogen web preview
  # SHOULD MATCH `kx/ky`
  $default_width: 19.05
  $default_height: 19.05

  # capX/capY is the size of a key cap
  capX: 18
  capY: 18

  # swHoleX/swHoleY is the size of a keyswitch
  swHoleX: 14
  swHoleY: 14

  # pad is used to bump the edges of the case polygon out
  pad: 12
  topPad: 14

  pcbOffsetX: 25
  pcbOffsetY: -125

  mcNotchW: 35
  mcNotchH: 26
  mcNotchSlope: 15

  mountHoleR: 2.2

  boxHeaderW: 33
  boxHeaderH: 9

points:
  key:
    # padding is Y (but at 90 it is X)
    padding: 1kx
    # spread is X (but at 90 it is Y)
    spread: 1kx

  zones:
    functionKeysMatrix:
      anchor.shift: [pcbOffsetX, pcbOffsetY]
      
      columns:
        f5:
          key.column_net: A4
        f6:
          key.column_net: A5
        f7:
          key.column_net: A6
        f8:
          key.column_net: A7

        f9:
          key.column_net: C13
          key.spread: 1.25kx
        f10:
          key.column_net: C14
        f11:
          key.column_net: C15
        f12:
          key.column_net: A0

        print:
          key.column_net: A1
          key.spread: 1.25kx
        scroll:
          key.column_net: A2
        pause:
          key.column_net: A3

      rows:
        only:
          shift: [6.5kx, 1.25kx]
          row_net: B4

    qwertyMatrix:
      # we are swapping rows for cols to get x stagger as we are not ortho linear
      anchor.rotate: -90
      anchor.shift: [pcbOffsetX, pcbOffsetY]

      # read as columns. see anchor.rotate
      rows:
        t5:
          column_net: A4
          shift: [0, 5kx]
        y6:
          column_net: A4
        u7:
          column_net: A5
        i8:
          column_net: A6
        o9:
          column_net: A7
        p10:
          column_net: C13
        minus:
          column_net: C14
        plus:
          column_net: C15
        backspace:
          column_net: A0

      # read as rows. see anchor.rotate
      columns:
        num:
          key.row_net: B5
          
          rows.t5:
            skip: true
            shift: [0, 4.75kx]

          # adjust the backspace key
          rows.backspace:
            height: 2kx
            shift: [0, 0.5kx]

        tab:
          key.row_net: B6

          rows.t5:
            skip: true
            shift: [0, 5.25kx]

          # no key here, just return
          rows.backspace.skip: true

        cap:
          key.row_net: B7

          rows.t5:
            shift: [0, 5.5kx]
            column_net: A4

          rows.y6.column_net: A5

          rows.u7.column_net: A6

          rows.i8.column_net: A7

          rows.o9.column_net: C13

          rows.p10.column_net: C14

          rows.minus.column_net: C15

          rows.plus.column_net: A0

          rows.backspace.column_net: A1

          # no key here, just return
          rows.backspace.skip: true

        shift:
          key.row_net: B8

          rows.t5.skip: true

          # adjust the RShift key
          rows.plus:
            height: 2.75kx
            shift: [0, 0.88kx]
            column_net: A0

          # no more keys on this row after RShift
          rows.backspace.skip: true

    ctrlMatrix:
      anchor.shift: [pcbOffsetX, pcbOffsetY]

      columns:
        space:
          key.column_net: A5
          rows.only:
            #spread: 4.75kx
            width: 3kx

        rAlt:
          key.column_net: C13
          rows.only:
            spread: 2.875kx
            width: 1.25kx

        fn:
          key.column_net: C14
          rows.only:
            spread: 1.25kx
            width: 1.25kx

        rClick:
          key.column_net: C15
          rows.only:
            spread: 1.25kx
            width: 1.25kx

        rCtrl:
          key.column_net: A0
          rows.only:
            spread: 1.25kx
            width: 1.25kx

      rows:
        only:
          shift: [7kx, -4kx]
          row_net: B9

    returnMatrix:
      anchor.shift: [pcbOffsetX, pcbOffsetY]
      columns:
        only:
          key.column_net: A0
      rows:
        only:
          shift: [13.7kx, -1.5kx]
          row_net: B6

    navMatrix:
      anchor.shift: [pcbOffsetX, pcbOffsetY]

      columns:
        left:
          key.column_net: A1
          rows.gap.skip: true
          rows.arrowUpper.skip: true

        middle:
          key.column_net: A2
          rows.gap.skip: true

        right:
          key.column_net: A3
          rows.gap.skip: true
          rows.arrowUpper.skip: true

      rows:
        arrowLower:
          row_net: B9
          shift: [15kx, -4kx]

        arrowUpper:
          row_net: B8
        gap:
        delRow:
          row_net: B6
        insertRow:
          row_net: B5

    mountingF6LMatrix:
      rows.only:
      columns.only.rows.only.adjust.ref.shift: [134, -113]

    mountingF9BMatrix:
      rows.only:
      columns.only.rows.only.adjust.ref.shift: [230, -113]

    mountingHomeTMatrix:
      rows.only:
      columns.only.rows.only.adjust.ref.shift: [330, -113]

    mountingRightTMatrix:
      rows.only:
      columns.only.rows.only.adjust.ref.shift: [349, -189]

    mountingLeftTMatrix:
      rows.only:
      columns.only.rows.only.adjust.ref.shift: [297.5, -189]

    mountingSpaceRMatrix:
      rows.only:
      columns.only.rows.only.adjust.ref.shift: [187, -201]

    mountingTabLMatrix:
      rows.only:
      columns.only.rows.only.adjust.ref.shift: [130, -144]

outlines:
  threeUKeyCaps:
    - what: rectangle
      where: true
      bound: false
      size: [3capX, capY]

  keyCaps:
    - what: rectangle
      where: true
      bound: false
      size: [capX, capY]

  switches:
    - what: rectangle
      where: true
      bound: false
      size: [swHoleX, swHoleY]
  
  mxHole:
    - what: polygon
      where: {}
      bound: false
      points:
        - { shift: [0, 0] }
        - { shift: [5, 0] }
        - { shift: [0, -0.3] }
        - { shift: [4, 0] }
        - { shift: [0, 0.3] }
        - { shift: [5, 0] }
        - { shift: [0, -14] }
        - { shift: [-5, 0] }
        - { shift: [0, 0.3] }
        - { shift: [-4, 0] }
        - { shift: [0, -0.3] }
        - { shift: [-5, 0] }

  polyHoles:
    - what: outline
      where: "/^qwertyMatrix_.*/"
      name: mxHole
      adjust:
        rotate: 90

    - what: outline
      where: ["/^functionKeysMatrix.*/", "/^ctrlMatrix.*/", "/^navMatrix.*/", "/^returnMatrix.*/"]
      name: mxHole

  mountingHoles:
    - what: circle
      where: "/mounting.*Matrix_.*/"
      bound: false
      radius: mountHoleR/2

  boxHeaderOutline:
    - what: polygon
      where: {}
      bound: false
      adjust.shift: [(204.5 - (boxHeaderW/2)), (-83 + (boxHeaderH/2))]
      points:
       - { shift: [0, 0] }
       - { shift: [boxHeaderW, 0] }
       - { shift: [0, -boxHeaderH] }
       - { shift: [-boxHeaderW, 0] }

  case:
    - what: polygon
      operation: stack
      points:
        - ref: qwertyMatrix_cap_t5
          shift: [0.5ky, -1pad]
        - ref: qwertyMatrix_cap_t5
          shift: [-1pad, -1pad]
        - ref: qwertyMatrix_num_y6
          shift: [-0.5ky, -1pad]
        - ref: functionKeysMatrix_f5_only
          shift: [-pad, topPad]
        - ref: functionKeysMatrix_f7_only
          shift: [-mcNotchSlope, topPad]
        - ref: functionKeysMatrix_f7_only
          shift: [0, mcNotchH]
        - ref: functionKeysMatrix_f7_only
          shift: [mcNotchW, mcNotchH]
        - ref: functionKeysMatrix_f7_only
          shift: [mcNotchW + mcNotchSlope, topPad]
        - ref: functionKeysMatrix_pause_only
          shift: [pad, topPad]
        - ref: navMatrix_right_arrowLower
          shift: [pad, -pad]
        - ref: ctrlMatrix_space_only
          shift: [-1.5kx, -pad]
      fillet: 0.25pad

  combo:
    - name: case
    - operation: subtract
      name: keyCaps

  caseOutline:
    - name: case
    - operation: subtract
      name: polyHoles
      adjust:
        shift: [-(swHoleX/2), swHoleY/2]
    - operation: subtract
      name: mountingHoles
    - operation: subtract
      name: boxHeaderOutline

cases:

pcbs:
  pcb-right:
    outlines:
      main:
        outline: case

    footprints:
      qwerty-switches:
        what: mx
        where: ["/^qwertyMatrix_.*/"]
        params:
          keycaps: true
          reverse: false
          hotswap: false
          from: "{{column_net}}"
          to: "{{colrow}}"
        adjust:
          rotate: 90

      other-switches:
        what: mx
        where: ["/^functionKeysMatrix.*/", "/^ctrlMatrix.*/", "/^navMatrix.*/", "/^returnMatrix.*/"]
        params:
          keycaps: true
          reverse: false
          hotswap: false
          from: "{{column_net}}"
          to: "{{colrow}}"

      qwerty-diodes:
        what: diode
        where: ["/^qwertyMatrix_.*/"]
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          smdPads: false
        adjust:
          rotate: 90
          shift: [5, 0]

      other-diodes:
        what: diode
        where: ["/^functionKeysMatrix.*/", "/^ctrlMatrix.*/", "/^navMatrix.*/", "/^returnMatrix.*/"]
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
          smdPads: false
        adjust:
          shift: [0, -5]

      box-header:
        what: boxheader
        where.ref.shift: [204.5, -83]
        params:
          H1: "A7"
          H2: "B0"
          H3: "B1"
          H4: "B10"
          H5: "B4"
          H6: "B5"
          H7: "B6"
          H8: "B7"
          H9: "B8"
          H10: "B9"
          H11: "A6"
          H12: "A5"
          H13: "A4"
          H14: "A3"
          H15: "A2"
          H16: "A1"
          H17: "A0"
          H18: "C15"
          H19: "C14"
          H20: "C13"

      mounting-holes:
        what: npth
        where: "/mounting.*Matrix_.*/"
        params:
          hole: mountHoleR
