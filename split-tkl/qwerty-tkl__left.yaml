meta:
  engine: 4.1.0

units:
  # kx/ky is the layout space used to position edge-to-edge,
  # for example using cherry mx as a guide:
  # a cherry mx switch pcb plate hole is 14x14,
  # a keycap is 18x18,
  # but the size to use for laying out edge to edge (taking into account gaps between switches/keycaps) is 19.05mm
  kx: 19.05
  ky: 19.05

  # make the ergogen web preview
  # SHOULD MATCH `kx/ky`
  $default_width: 19.05
  $default_height: 19.05

  # capX/capY is the size of a key cap
  capX: 18
  capY: 18

  # swHoleX/swHoleY is the size of a keyswitch
  swHoleX: 14
  swHoleY: 14
  swHoleBump: 0.25

  # pad is used to bump the edges of the case polygon out
  pad: 12
  topPad: 14

  pcbOffsetX: 100
  pcbOffsetY: -100

  mcNotchW: 110
  mcNotchH: 32.5
  mcNotchOffset: 5

  mountHoleR: 2.2
  mountHolePassthrough: 3

  plateThickness: 3.5

points:
  key:
    # padding is Y (but at 90 it is X)
    padding: 1kx
    # spread is X (but at 90 it is Y)
    spread: 1kx

  zones:
    functionKeysMatrix:
      anchor.shift: [pcbOffsetX, pcbOffsetY]

      columns:
        esc:
          key.column_net: B12

        f1:
          key.spread: 1.25kx
          key.column_net: B13

        f2:
          key.column_net: B14

        f3:
          key.column_net: B15

        f4:
          key.column_net: A8

        f5:
          key.spread: 1.25kx
          key.column_net: A9

      rows:
        only:
          shift: [0, 1.25kx]
          row_net: B4

    qwertyMatrix:
      # we are swapping rows for cols to get x stagger as we are not ortho linear
      anchor.rotate: -90
      anchor.shift: [pcbOffsetX, pcbOffsetY]

      # read as columns. see anchor.rotate
      rows:
        lBord:
          column_net: B12
        q1:
          column_net: B13
        w2:
          column_net: B14
        e3:
          column_net: B15
        r4:
          column_net: A8
        t5:
          column_net: A9
        y6:
          column_net: A10

      # read as rows. see anchor.rotate
      columns:
        num:
          key.row_net: B5

        tab:
          key.row_net: B6

          # adjust the TAB key
          rows.lBord:
            # adjusts the width of this key but from center outwards
            height: 1.5kx
            # after it stretch out from center re aligns the left/start pos
            # formula = `{height}/6`
            shift: [0, 0.25kx]
            # fixes the start of the next key
            # formula = `{height}/1.2`
            padding: 1.25kx

        cap:
          key.row_net: B7

          # adjust the CAPS key
          rows.lBord:
            skip: true
            padding: 1.75kx

        shift:
          key.row_net: B8

          # adjust the LShift key
          rows.lBord:
            height: 1.25kx
            shift: [0, 0.125kx]
            padding: 1.125kx

    ctrlMatrix:
      anchor.shift: [pcbOffsetX, pcbOffsetY]

      columns:
        ctrl:
          rows.only:
            width: 1.25kx
            adjust.shift: [0.125kx, 0]
          key.column_net: B12

        win:
          rows.only:
            # spread seems to be the spacing after prev
            # set it to the width of the col before
            # and on this first one add what the extra would have been (seems to be needed because of the use of adjust.shift on col 1)
            spread: 1.25kx + 0.125kx
            width: 1.25kx
          key.column_net: B13

        lAlt:
          rows.only:
            spread: 1.75kx
            width: 1.25kx
          key.column_net: B15

        space:
          rows.only:
            spread: 2.5kx
            width: 3.75kx
          key.column_net: A9

      rows:
        only:
          shift: [0, -4kx]
          row_net: B9

    mountingCapsMatrix:
      rows.only:
      columns.only.rows.only.adjust.ref.shift: [112.5, -137.6]

    mountingLeftAltMatrix:
      rows.only:
      columns.only.rows.only.adjust.ref.shift: [142.5, -170]

    mountingSpaceLMatrix:
      rows.only:
      columns.only.rows.only.adjust.ref.shift: [182.5, -170]

    mountingSpaceRMatrix:
      rows.only:
      columns.only.rows.only.adjust.ref.shift: [225, -170]

    mountingTildeTMatrix:
      rows.only:
      columns.only.rows.only.adjust.ref.shift: [100, -88.1]

    mountingThreeTMatrix:
      rows.only:
      columns.only.rows.only.adjust.ref.shift: [157, -88.1]

    mountingSixTMatrix:
      rows.only:
      columns.only.rows.only.adjust.ref.shift: [214, -88.1]

    mountingControllerLTMatrix:
      rows.only:
      columns.only.rows.only.adjust.ref.shift: [98, -60]

    mountingBoxLMatrix:
      rows.only:
      columns.only.rows.only.adjust.ref.shift: [165, -47]

    mountingBoxRMatrix:
      rows.only:
      columns.only.rows.only.adjust.ref.shift: [210, -47]

outlines:
  threeUKeyCaps:
    - what: rectangle
      where: "/^ctrlMatrix_space/"
      bound: false
      size: [3capX, capY]

  keyCaps:
    - what: rectangle
      where: "-/mounting.*Matrix_.*/"
      bound: false
      size: [capX, capY]

  mountingHoles:
    - what: circle
      where: "/mounting.*Matrix_.*/"
      bound: false
      radius: mountHolePassthrough

  mxHole:
    - what: polygon
      where: {}
      bound: false
      points:
        - { shift: [0, 0] }
        - { shift: [5, 0] }
        - { shift: [0, -swHoleBump] }
        - { shift: [4, 0] }
        - { shift: [0, swHoleBump] }
        - { shift: [5, 0] }
        - { shift: [0, -14] }
        - { shift: [-5, 0] }
        - { shift: [0, swHoleBump] }
        - { shift: [-4, 0] }
        - { shift: [0, -swHoleBump] }
        - { shift: [-5, 0] }

  plateTopCutOff:
    - what: polygon
      where: "/^functionKeysMatrix_esc_only/"
      bound: false
      adjust:
        shift: [-15, 35]
      points:
        - { shift: [0, 0] }
        - { shift: [150, 0] }
        - { shift: [0, -24] }
        - { shift: [-150, 0] }

  plateSwitchHoles:
    - what: outline
      where: "/^qwertyMatrix_.*/"
      name: mxHole
      adjust:
        rotate: 90

    - what: outline
      where: ["/^functionKeysMatrix.*/", "/^ctrlMatrix.*/"]
      name: mxHole

  pcbOutline:
    - what: polygon
      operation: stack
      points:
        - ref: functionKeysMatrix_esc_only
          shift: [-1pad, topPad]
        - ref: functionKeysMatrix_esc_only
          shift: [mcNotchOffset, mcNotchH]
        - ref: functionKeysMatrix_esc_only
          shift: [mcNotchOffset+mcNotchW, mcNotchH]
        - ref: functionKeysMatrix_f5_only
          shift: [pad, topPad]
        - ref: qwertyMatrix_cap_y6
          shift: [-0.5ky, 0.7kx]
        - ref: ctrlMatrix_space_only
          shift: [1.8kx, -1pad]
        - ref: ctrlMatrix_ctrl_only
          shift: [-1.2pad, -pad]
      fillet: 0.25pad

  comboKeys:
    - name: pcbOutline
    - operation: subtract
      name: keyCaps
    - operation: subtract
      name: threeUKeyCaps

  plateOutline:
    - name: pcbOutline
    - operation: subtract
      name: plateSwitchHoles
      adjust:
        shift: [-(swHoleX/2), swHoleY/2]
    - operation: subtract
      name: mountingHoles
    - operation: subtract
      name: plateTopCutOff

cases:
  plate:
    - what: outline
      name: plateOutline
      extrude: plateThickness


pcbs:
  pcb-left:
    outlines:
      main:
        outline: pcbOutline

    footprints:
      qwerty-switches:
        what: mx
        where: ["/^qwertyMatrix_.*/"]
        params:
          keycaps: true
          reverse: false
          hotswap: false
          from: "{{column_net}}"
          to: "{{colrow}}"
        adjust:
          rotate: 90

      other-switches:
        what: mx
        where: ["/^functionKeysMatrix.*/", "/^ctrlMatrix.*/"]
        params:
          keycaps: true
          reverse: false
          hotswap: false
          from: "{{column_net}}"
          to: "{{colrow}}"

      qwerty-diodes:
        what: diode
        where: ["/^qwertyMatrix_.*/"]
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          rotate: 90
          shift: [5, 0]

      other-diodes:
        what: diode
        where: ["/^functionKeysMatrix.*/", "/^ctrlMatrix.*/"]
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
          shift: [0, -5]

      black-pill-controller:
        what: blackpill
        where.ref.shift: [132, -55]

      box-header:
        what: boxheader
        where.ref.shift: [187, -58]
        params:
          H1: "A7"
          H2: "B0"
          H3: "B1"
          H4: "B10"
          H5: "B4"
          H6: "B5"
          H7: "B6"
          H8: "B7"
          H9: "B8"
          H10: "B9"
          H11: "A6"
          H12: "A5"
          H13: "A4"
          H14: "A3"
          H15: "A2"
          H16: "A1"
          H17: "A0"
          H18: "C15"
          H19: "C14"
          H20: "C13"

      mounting-holes:
        what: npth
        where: "/mounting.*Matrix_.*/"
        params:
          hole: mountHoleR
