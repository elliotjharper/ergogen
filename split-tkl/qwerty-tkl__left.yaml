meta:
  engine: 4.1.0

units:
  # kx/ky is the layout space used to position edge-to-edge,
  # for example using cherry mx as a guide:
  # a cherry mx switch pcb plate hole is 14x14,
  # a keycap is 18x18,
  # but the size to use for laying out edge to edge (taking into account gaps between switches/keycaps) is 19.05mm
  kx: 19.05
  ky: 19.05

  # make the ergogen web preview
  # SHOULD MATCH `kx/ky`
  $default_width: 19.05
  $default_height: 19.05

  # capX/capY is the size of a key cap
  capX: 18
  capY: 18

  # swHoleX/swHoleY is the size of a keyswitch
  swHoleX: 14
  swHoleY: 14
  swHoleBump: 0.25

  # pad is used to bump the edges of the case polygon out
  pad: 12
  topPad: 14

  pcbOffsetX: 100
  pcbOffsetY: -100

  mcNotchW: 110
  mcNotchH: 32.5
  mcNotchOffset: 5

  mountHoleR: 2.2
  mountHolePassthrough: 3

  plateThickness: 3.5

  boxHeaderW: 33
  boxHeaderH: 9

  blackpillW: 53
  blackpillH: 20.5

  converterW: 65
  converterH: 30

points:
  key:
    # padding is Y (but at 90 it is X)
    padding: 1kx
    # spread is X (but at 90 it is Y)
    spread: 1kx

  zones:
    functionKeysMatrix:
      anchor.shift: [pcbOffsetX, pcbOffsetY]

      columns:
        esc:
          key.column_net: B12

        f1:
          key.spread: 1.25kx
          key.column_net: B13

        f2:
          key.column_net: B14

        f3:
          key.column_net: B15

        f4:
          key.column_net: A8

        f5:
          key.spread: 1.25kx
          key.column_net: A9

      rows:
        only:
          shift: [0, 1.25kx]
          row_net: B4

    qwertyMatrix:
      # we are swapping rows for cols to get x stagger as we are not ortho linear
      anchor.rotate: -90
      anchor.shift: [pcbOffsetX, pcbOffsetY]

      # read as columns. see anchor.rotate
      rows:
        lBord:
          column_net: B12
        q1:
          column_net: B13
        w2:
          column_net: B14
        e3:
          column_net: B15
        r4:
          column_net: A8
        t5:
          column_net: A9
        y6:
          column_net: A10

      # read as rows. see anchor.rotate
      columns:
        num:
          key.row_net: B5

        tab:
          key.row_net: B6

          # adjust the TAB key
          rows.lBord:
            # adjusts the width of this key but from center outwards
            height: 1.5kx
            # after it stretch out from center re aligns the left/start pos
            # formula = `{height}/6`
            shift: [0, 0.25kx]
            # fixes the start of the next key
            # formula = `{height}/1.2`
            padding: 1.25kx

          rows.y6.skip: true # skip the y key

        cap:
          key.row_net: B7

          # adjust the CAPS key
          rows.lBord:
            skip: true # skip the caps key itself
            padding: 1.75kx # move the start of the caps row over to the right

          rows.y6.skip: true # skip the h key

        shift:
          key.row_net: B8

          # adjust the LShift key
          rows.lBord:
            height: 1.25kx
            shift: [0, 0.125kx]
            padding: 1.125kx

    ctrlMatrix:
      anchor.shift: [pcbOffsetX, pcbOffsetY]

      columns:
        ctrl:
          rows.only:
            width: 1.25kx
            adjust.shift: [0.125kx, 0]
          key.column_net: B12

        win:
          rows.only:
            # spread seems to be the spacing after prev
            # set it to the width of the col before
            # and on this first one add what the extra would have been (seems to be needed because of the use of adjust.shift on col 1)
            spread: 1.25kx + 0.125kx
            width: 1.25kx
          key.column_net: B13

        lAlt:
          rows.only:
            spread: 1.75kx
            width: 1.25kx
          key.column_net: B15

        space:
          rows.only:
            spread: 2.5kx
            width: 3.75kx
          key.column_net: A9

      rows:
        only:
          shift: [0, -4kx]
          row_net: B9

    mountingCapsMatrix:
      rows.only:
      columns.only.rows.only.adjust.ref.shift: [94, -137.6]

    mountingGMatrix:
      rows.only:
      columns.only.rows.only.adjust.ref.shift: [223, -130]

    mountingLeftAltMatrix:
      rows.only:
      columns.only.rows.only.adjust.ref.shift: [142.5, -183]

    # mountingSpaceLMatrix:
    #   rows.only:
    #   columns.only.rows.only.adjust.ref.shift: [182.5, -183]

    mountingSpaceRMatrix:
      rows.only:
      columns.only.rows.only.adjust.ref.shift: [223, -183]

    mountingTildeTMatrix:
      rows.only:
      columns.only.rows.only.adjust.ref.shift: [94, -88.1]

    mountingThreeTMatrix:
      rows.only:
      columns.only.rows.only.adjust.ref.shift: [157, -88.1]

    mountingSixTMatrix:
      rows.only:
      columns.only.rows.only.adjust.ref.shift: [223, -88.1]

    mountingPicoLMatrix:
      rows.only:
      columns.only.rows.only.adjust.ref.shift: [124, -48]

    mountingPicoRMatrix:
      rows.only:
      columns.only.rows.only.adjust.ref.shift: [196, -48]

outlines:
  threeUKeyCaps:
    - what: rectangle
      where: '/^ctrlMatrix_space/'
      bound: false
      size: [3capX, capY]

  keyCaps:
    - what: rectangle
      where: '-/mounting.*Matrix_.*/'
      bound: false
      size: [capX, capY]

  mountingHoles:
    - what: circle
      where: '/mounting.*Matrix_.*/'
      bound: false
      radius: mountHoleR/2

  mxHole:
    - what: polygon
      where: {}
      bound: false
      points:
        - { shift: [0, 0] }
        - { shift: [5, 0] }
        - { shift: [0, -swHoleBump] }
        - { shift: [4, 0] }
        - { shift: [0, swHoleBump] }
        - { shift: [5, 0] }
        - { shift: [0, -14] }
        - { shift: [-5, 0] }
        - { shift: [0, swHoleBump] }
        - { shift: [-4, 0] }
        - { shift: [0, -swHoleBump] }
        - { shift: [-5, 0] }

  plateTopCutOff:
    - what: polygon
      where: '/^functionKeysMatrix_esc_only/'
      bound: false
      adjust:
        shift: [-15, 35]
      points:
        - { shift: [0, 0] }
        - { shift: [150, 0] }
        - { shift: [0, -24] }
        - { shift: [-150, 0] }

  plateSwitchHoles:
    - what: outline
      where: '/^qwertyMatrix_.*/'
      name: mxHole
      adjust:
        rotate: 90

    - what: outline
      where: ['/^functionKeysMatrix.*/', '/^ctrlMatrix.*/']
      name: mxHole

  plateTestBlank:
    - what: polygon
      where: {}
      bound: false
      points:
        - { shift: [0, 0] }
        - { shift: [30, 0] }
        - { shift: [0, -34] }
        - { shift: [-30, 0] }

  blackpillOutline:
    - what: polygon
      where: {}
      bound: false
      adjust.shift: [(132 - (blackpillW/2)), (-56 + (blackpillH/2))]
      points:
        - { shift: [0, 0] }
        - { shift: [blackpillW, 0] }
        - { shift: [0, -blackpillH] }
        - { shift: [-blackpillW, 0] }

  boxHeaderOutline:
    - what: polygon
      where: {}
      bound: false
      adjust.shift: [(187 - (boxHeaderW/2)), (-58 + (boxHeaderH/2))]
      points:
        - { shift: [0, 0] }
        - { shift: [boxHeaderW, 0] }
        - { shift: [0, -boxHeaderH] }
        - { shift: [-boxHeaderW, 0] }

  plateTestOutline:
    - name: plateTestBlank
    - operation: subtract
      name: mxHole
      adjust.shift: [8, -10]

  pcbOutline:
    - what: polygon
      operation: stack
      points:
        # top left corner (lower)
        - ref: functionKeysMatrix_esc_only
          shift: [-1pad, topPad]
        # top left corner (upper)
        - ref: functionKeysMatrix_esc_only
          shift: [mcNotchOffset, mcNotchH]
        # top right corner (upper)
        - ref: functionKeysMatrix_esc_only
          shift: [mcNotchOffset+mcNotchW, mcNotchH]
        # top right corner (lower)
        - ref: functionKeysMatrix_f5_only
          shift: [2pad, topPad]

        # - ref: qwertyMatrix_cap_y6
        #   shift: [-0.5ky, 0.7kx]

        # bottom right corner
        - ref: ctrlMatrix_space_only
          shift: [1.135kx, -1pad]
        # bottom left corner
        - ref: ctrlMatrix_ctrl_only
          shift: [-1.2pad, -pad]
      fillet: 0.25pad

  comboKeys:
    - name: pcbOutline
    - operation: subtract
      name: keyCaps
    - operation: subtract
      name: threeUKeyCaps

  caseOutline:
    - name: pcbOutline
    - operation: subtract
      name: plateSwitchHoles
      adjust:
        shift: [-(swHoleX/2), swHoleY/2]
    - operation: subtract
      name: mountingHoles
    - operation: subtract
      name: blackpillOutline
    - operation: subtract
      name: boxHeaderOutline

  converterOutline:
    - what: polygon
      where: {}
      bound: false
      points:
        - { shift: [0, 0] }
        - { shift: [converterW, 0] }
        - { shift: [0, -converterH] }
        - { shift: [-converterW, 0] }

  gateronTestOutline:
    - what: polygon
      where: {}
      bound: false
      adjust.shift: [0, -10]
      points:
        - { shift: [0, 0] }
        - { shift: [20, 0] }
        - { shift: [0, -20] }
        - { shift: [-20, 0] }

cases:
  plate:
    - what: outline
      name: caseOutline
      extrude: plateThickness

  plateTest:
    - what: outline
      name: plateTestOutline
      extrude: plateThickness

pcbs:
  test-pcb:
    outlines:
      main:
        outline: gateronTestOutline

    footprints:
      test-switch:
        what: gateronmx33
        where.ref.shift: [10, -20]
        params:
          keycaps: true
          mirror: false
          from: '{{column_net}}'
          to: '{{colrow}}'

  pcb-left:
    outlines:
      main:
        outline: pcbOutline

    footprints:
      qwerty-switches:
        what: gateronmx33
        where: ['/^qwertyMatrix_.*/']
        params:
          keycaps: true
          mirror: false
          smdDiode: true
          from: '{{column_net}}'
          to: '{{colrow}}'
        adjust:
          rotate: 90

      other-switches:
        what: gateronmx33
        where: ['/^functionKeysMatrix.*/', '/^ctrlMatrix.*/']
        params:
          keycaps: true
          mirror: false
          smdDiode: true
          from: '{{column_net}}'
          to: '{{colrow}}'

      pico-controller:
        what: pico
        params:
          drawOutline: true
          drawPinLabels: true
        where.ref.shift: [160, -55]

      mounting-holes:
        what: npth
        where: '/mounting.*Matrix_.*/'
        params:
          hole: mountHoleR
